# Переопределённые скрипты

# Переопределено чтобы _SMART_PARK всегда был в одной точке
[gcode_macro _SAF_SMART_PARK]
description: Parks your printhead over the start of line purge
gcode:
    # Get relevant printer params
    {% set travel_speed = (printer.toolhead.max_velocity) * 30 | float %}
    {% set z_height = printer["gcode_macro _KAMP_Settings"].smart_park_height | float %}

    {% set park_x = printer["gcode_macro _CUSTOM_ANDREWSHA_SETTINGS"].purge_start_x | float %}
    {% set park_y = printer["gcode_macro _CUSTOM_ANDREWSHA_SETTINGS"].purge_start_y | float %}

    { action_respond_info("Smart Park location: {},{}.".format(
            (park_x),
            (park_y),
        )) }

    SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

    G92 E0                                                                                  # Reset extruder
    G0 F{travel_speed}                                                                      # Set travel speed
    G90                                                                                     # Absolute positioning
    G0 X{park_x} Y{park_y}                                                                  # Move to purge start position
    G0 Z{z_height}                                                                          # Move to purge Z height

    RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state


# Переопределено чтобы _LINE_PURGE начинался в одной точке
[gcode_macro _SAF_LINE_PURGE]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    {% set travel_speed = (printer.toolhead.max_velocity) * 30 | float %}
    {% set z_height = printer["gcode_macro _KAMP_Settings"].line_purge_z_hop | float %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    {% set retract_amount = printer["gcode_macro _KAMP_Settings"].line_purge_retract | float %}
    {% set retract_speed = (printer["gcode_macro _KAMP_Settings"].line_purge_retract_speed * 60) | float %}
    {% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}

    # Always purge in a fixed safe spot
    {% set purge_start_x = printer["gcode_macro _CUSTOM_ANDREWSHA_SETTINGS"].purge_start_x | float %}
    {% set purge_start_y = printer["gcode_macro _CUSTOM_ANDREWSHA_SETTINGS"].purge_start_y | float %}
    {% set purge_end_x = printer["gcode_macro _CUSTOM_ANDREWSHA_SETTINGS"].purge_end_x | float %}
    {% set purge_end_y = printer["gcode_macro _CUSTOM_ANDREWSHA_SETTINGS"].purge_end_y | float %}

    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {action_respond_info("Line purge starting at {}, {} and ending at {}, {}. Purging {}mm of filament at {}mm3/s.".format(
        (purge_start_x),
        (purge_start_y),
        (purge_end_x),
        (purge_end_y),
        (purge_amount),
        (flow_rate),
    )) }

    SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

    G92 E0                                                                                  # Reset extruder
    G0 F{travel_speed}                                                                      # Set travel speed
    G90                                                                                     # Absolute positioning
    G0 X{purge_start_x} Y{purge_start_y}                                                    # Move to purge position
    G0 Z{purge_height}                                                                      # Move to purge Z height
    M83                                                                                     # Relative extrusion mode
    G1 E{tip_distance} F{purge_move_speed}                                                  # Move filament tip
    G1 X{purge_end_x} Y{purge_end_y} E{purge_amount} F{purge_move_speed}                    # Fixed purge line
    G1 E-{retract_amount} F{retract_speed}                                                  # Retraction at end
    G0 X{purge_end_x + 10} Y{purge_end_y} F{travel_speed}                                   # Rapid move to break string
    G92 E0                                                                                  # Reset extruder distance
    M82                                                                                     # Absolute extrusion mode
    G0 Z{z_height} F{travel_speed}                                                          # Z hop

    G0 X35 Y200 F{travel_speed}

    RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state


# Проверка после построения карты печатаемой области, что range не более заданного лимита.
# Eddy датчик имеет свойство периодически отваливаться и руинить всю печать. Это средство защиты
[gcode_macro _SAF_START_PRINT_AFTER_BED_MESH]
description: Check bed mesh range and pause if too large
gcode:
    {% set mesh = printer.bed_mesh.probed_matrix %}
    {% set limit = printer["gcode_macro _CUSTOM_ANDREWSHA_SETTINGS"].bed_mesh_range_limit | float %}
    {% set pause_on_high_range = printer["gcode_macro _CUSTOM_ANDREWSHA_SETTINGS"].bed_mesh_pause_on_high_range %}

    {% if mesh %}
        {% set min_z = (mesh | map('min') | min) | float %}
        {% set max_z = (mesh | map('max') | max) | float %}
        {% set range_z = (max_z - min_z) | float %}
        {% set min_z_r = min_z | round(3) %}
        {% set max_z_r = max_z | round(3) %}
        {% set range_z_r = range_z | round(3) %}
        {% set limit_r = limit | round(3) %}

        RESPOND TYPE=command MSG="Bed mesh range: {range_z_r} mm (min={min_z_r}, max={max_z_r}, limit={limit_r})"

        {% if pause_on_high_range and range_z > limit %}
            RESPOND TYPE=error MSG="Bed mesh range too high: {range_z_r} mm > {limit_r} mm. Print paused."
            PAUSE
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="Bed mesh check skipped: probed_matrix is empty"
    {% endif %}
