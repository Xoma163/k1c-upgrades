# copied and slightly modified from https://raw.githubusercontent.com/kyleisah/Klipper-Adaptive-Meshing-Purging/refs/heads/main/Configuration/Line_Purge.cfg
[gcode_macro _LINE_PURGE]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    {% set travel_speed = (printer.toolhead.max_velocity) * 30 | float %}
    {% set z_height = printer["gcode_macro _KAMP_Settings"].line_purge_z_hop | float %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    {% set retract_amount = printer["gcode_macro _KAMP_Settings"].line_purge_retract | float %}
    {% set retract_speed = (printer["gcode_macro _KAMP_Settings"].line_purge_retract_speed * 60) | float %}
    {% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}

    # custom andrewsha. Always purge in a fixed safe spot
    {% set purge_start_x = printer["gcode_macro _KAMP_Settings"].purge_start_x | float %}
    {% set purge_start_y = printer["gcode_macro _KAMP_Settings"].purge_start_y | float %}
    {% set purge_end_x = printer["gcode_macro _KAMP_Settings"].purge_end_x | float %}
    {% set purge_end_y = printer["gcode_macro _KAMP_Settings"].purge_end_y | float %}

    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {action_respond_info("Line purge starting at {}, {} and ending at {}, {}. Purging {}mm of filament at {}mm3/s.".format(
        (purge_start_x),
        (purge_start_y),
        (purge_end_x),
        (purge_end_y),
        (purge_amount),
        (flow_rate),
    )) }

    SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

    G92 E0                                                                                  # Reset extruder
    G0 F{travel_speed}                                                                      # Set travel speed
    G90                                                                                     # Absolute positioning
    G0 X{purge_start_x} Y{purge_start_y}                                                    # Move to purge position
    G0 Z{purge_height}                                                                      # Move to purge Z height
    M83                                                                                     # Relative extrusion mode
    G1 E{tip_distance} F{purge_move_speed}                                                  # Move filament tip
    G1 X{purge_end_x} Y{purge_end_y} E{purge_amount} F{purge_move_speed}                    # Fixed purge line
    G1 E-{retract_amount} F{retract_speed}                                                  # Retraction at end
    G0 X{purge_end_x + 10} Y{purge_end_y} F{travel_speed}                                   # Rapid move to break string
    G92 E0                                                                                  # Reset extruder distance
    M82                                                                                     # Absolute extrusion mode
    G0 Z{z_height} F{travel_speed}                                                          # Z hop

    G0 X35 Y200 F{travel_speed}                                                             # custom andrewsha. Intermediate move after purge to avoid hitting the brush

    RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
